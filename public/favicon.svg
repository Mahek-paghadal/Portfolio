<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="MP">
	<rect width="64" height="64" rx="16" fill="#1f252d" />
	<rect x="4" y="4" width="56" height="56" rx="14" fill="#212a34" stroke="#22d3ee" stroke-width="2" />
	<defs>
		<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
			<feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur" />
			<feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.13  0 0 0 0 0.83  0 0 0 0 0.93  0 0 0 0.7 0" result="glow" />
			<feMerge>
				<feMergeNode in="glow" />
				<feMergeNode in="SourceGraphic" />
			</feMerge>
		</filter>
	</defs>
	<text
		x="50%"
		y="50%"
		text-anchor="middle"
		dominant-baseline="middle"
		font-family="Zilla Slab, serif"
		font-size="28"
		font-weight="700"
		fill="#67e8f9"
		filter="url(#glow)"
	>
		MP
	</text>
</svg>